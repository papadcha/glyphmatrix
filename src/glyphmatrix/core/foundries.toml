kind = "tool"
patterns = ["\\bmetamorphosis\\b", "\\balltype\\b", "\\bscanahand\\b", "\\bfontforge\\b", "\\bmftrace\\b"]

[[foundry]]
name = "SIL Open Font Licence"
kind = "licence"
patterns = ["^sil$", "licensed under", "reserved font name"]
