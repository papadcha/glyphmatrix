# Catalogue of foundries, publishers, tools and licences that fontctl recognises.
# One [[foundry]] per publisher. Everything here is data: add an entry, not code.
# A file passed with --foundries (or ~/.glyphmatrix/foundries.toml) is merged on
# top of this one: an entry with the same `name` replaces the packaged one.
#
# name        folder name (organize's Vendor level). Required, unique (case-insensitive).
# holder      folder name for `--profile tidy`, when the library's established holder
#             differs from `name` (e.g. "Microsoft Corporation"). Default: name.
# kind        foundry | person | project | tool | licence.  tool and licence are never a
#             publisher: text that matches them (aliases / patterns) goes to _Unknown.
# aliases     whole names that mean this publisher (compared ignoring case and accents).
# prefixes    names that START with this text mean this publisher (longest wins).
# vendor_ids  OS/2 achVendID tags (4 characters, case-sensitive).
# stamps      text the foundry writes into the unique ID (nameID 3) or version string
#             (nameID 5), e.g. "Brendel            :Aldine". Used when nothing else
#             names a publisher, or - with --fold-reissues - over `reissues`.
# patterns    regular expressions, searched in a name-table string (case-insensitive).
# reissues    other holders whose copyright appears in this foundry's own packages.
#             With --fold-reissues those fonts go under this foundry.
# parent      a foundry this one is a twin or branch of (information only).
# status      confirmed | inferred | user-decision   (how sure the entry is)
# decided     YYYY-MM-DD   sources: where it was checked   notes: why

