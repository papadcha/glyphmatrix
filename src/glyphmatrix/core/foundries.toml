# ---- publishers decided while sorting real collections (2026-11-12) ----

[[foundry]]
name = "Brendel Informatik"
kind = "foundry"
aliases = ["brendel", "brendel informatik gmbh", "brendel & pabst"]
stamps = ["Brendel            :"]
reissues = ["Southern Software", "M. Klein", "Adobe", "URW"]
parent = "SoftMaker"
status = "user-decision"
decided = "2026-11-12"
sources = ["https://luc.devroye.org/fonts-23628.html"]
notes = """Packages of its own CD carry 'Brendel :' in the unique ID (nameID 3) and the build date
(nameID 5) even when the copyright names Southern Software, M. Klein or Adobe (Witchdoctor is
Monotype's Biffo). B & P Graphics (= Brendel & Pabst, per Devroye) is kept apart until decided."""

[[foundry]]
name = "SoftMaker"
aliases = ["softmaker software gmbh", "softmaker"]
status = "confirmed"

[[foundry]]
name = "Southern Software"
holder = "Southern Software, Inc"
aliases = ["southern software, inc", "southern software inc", "southern software"]
prefixes = ["199 southern software", "southern software"]
status = "confirmed"
notes = "'Copyright c 1992 Southern Software' - the bare 'c' is the copyright sign"

[[foundry]]
name = "B & P Graphics"
aliases = ["b & p graphics", "b & p graphics, ltd", "b+p graphics"]
related = "Brendel Informatik"
status = "inferred"
decided = "2026-11-12"
sources = ["https://luc.devroye.org/fonts-23628.html"]
notes = "Brendel & Pabst = B & P Graphics = Brendel Informatik (Devroye). Not merged yet: the user keeps it separate."

[[foundry]]
name = "Weatherly Systems"
holder = "Weatherly Systems Inc"
aliases = ["w.s.i", "w.s.i.", "weatherly systems, inc", "weatherly systems inc", "weatherly systems"]
status = "user-decision"
decided = "2026-11-12"
notes = "WSI-Font Collection; 'W.S.I.' and 'Weatherly Systems, Inc' are the same company. WSI-Fonts (the collection name) is kept as it is."

[[foundry]]
name = "Rabbit Reproductions Typefoundry"
aliases = ["rabbit reproductions typefoundry", "red rooster typefounders", "red rooster collection"]
status = "user-decision"
decided = "2026-11-12"
sources = ["https://luc.devroye.org/nickcurtis.html", "https://luc.devroye.org/myfonts-modern"]
notes = "Rabbit Reproductions = Red Rooster (Pat Hickson), published and digitised through ITF / dtpTypes. The 'RR' ending of the family names marks them. ITF itself is deliberately NOT an alias: ITF published many other designers."

[[foundry]]
name = "Expert Software"
aliases = ["expert software"]
status = "user-decision"
decided = "2026-11-12"
sources = ["https://luc.devroye.org/fonts-48589.html"]
notes = "Budget CDs of ~2000 fonts (EX0001...). Every copyright is 'Generated by Fontographer'; Devroye calls it one of the largest font cloners."

[[foundry]]
name = "Agfa Monotype"
aliases = ["agfa monotype", "agfa monotype corporation"]
status = "confirmed"
notes = "nameID 8 of the Neo Sans/Neo Tech fonts is a whole copyright sentence; 'Digitized data (C) Agfa Monotype Corporation' names the holder"

[[foundry]]
name = "Avid Technology"
aliases = ["avid technology", "avid technology inc"]
status = "confirmed"

# ---- tools and licences: never a publisher ----

[[foundry]]
