notes = "Editor placeholders: 'Generated by Fontographer 3.5', vendor ID Alts"

[[foundry]]
name = "FontLab"
kind = "tool"
vendor_ids = ["pyrs", "PYRS"]
patterns = ["fontlab", "pyrus"]

[[foundry]]
name = "FontCreator"
kind = "tool"
vendor_ids = ["HL  "]
patterns = ["high-logic", "erwin denissen"]

[[foundry]]
