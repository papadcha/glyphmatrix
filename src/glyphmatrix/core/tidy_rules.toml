# Twin copyright: a sub-folder with the shared name (RULES B2 #2). "/" nests.
"brendel informatik & softmaker" = "SoftMaker/Brendel Informatik & SoftMaker"
"brendel informatik cologne" = "SoftMaker/Brendel Informatik & SoftMaker"

# Not a publisher: the name is a tool, licence, description or leftover. (RULES B2 #3-5, E3)
# Regular expressions, searched from the start of the cleaned name.
[holder]
not_publishers = [
  # tools
  "(?:converted by |made with |created (?:with|by) )?(?:fontographer|metamorphosis|alltype|scanahand|fontforge)",
  # licences and notices
  "freeware", "shareware", "licensed under", "copy ?left", "sil$", "notice not found",
  "for viewing only", "prawa nie",
  # descriptions
  ".*\\b(?:is based on|designed and encoded by|based partiall?y on)\\b", "the splines of this font",
  "linedrawing characters", "from the tim burton film", "typeface - ",
  # leftovers
  "generated$", "v?\\d+(?:\\.\\d+)*$", "version \\d", "http", "e-?mail", "fassung", "red no\\.", "kirie ",
  "ultrablack ", "dads recipe", "\\d+(?:,\\d+)+$", "\\d+\\.\\d+.*latest version", "nowak\\.tv", "phi-jamacon",
]
