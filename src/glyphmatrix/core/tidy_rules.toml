# Rules for `fontctl organize --profile tidy` (see RULES.md in the tidy report).
# Everything here is data: add a line, not code. A user file passed with
# --rules is merged on top of this one (its entries win).
#
# Matching is case-insensitive. A value of "" means "not a publisher" (_Unknown).

# Whole holder name -> canonical name.  (RULES E2)
[holder.exact]
"(urw)++" = "URW"
"digitized data" = "Google Inc"
"google corporation" = "Google Inc"
"softmaker software gmbh" = "SoftMaker"
"typodermic do not distribute" = "Typodermic"
"hanyang i&c co" = "HanYang I&C Co., Ltd"
"hanyang i&c co.,ltd" = "HanYang I&C Co., Ltd"
"hanyang i&c co., ltd" = "HanYang I&C Co., Ltd"
"sharif farsiweb, inc" = "Sharif FarsiWeb"
"shakirulqadree" = "Syed Shakir ul Qadree"
"attari qadri" = "Ishtiaq Ali Attari Qadri"
"mãns greb‰ck" = "Mans Greback"
"mâns greb‰ck" = "Mans Greback"
"mans greb‰ck" = "Mans Greback"
"pelayo rodrìguez" = "Pelayo Rodriguez"
"made with scanahand" = ""

# Name that STARTS WITH the key -> canonical name. Longest key wins.
